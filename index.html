<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creativos One</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
}

nav {
    padding: 20px;
    background: white;
}

button {
    padding: 12px 18px;
    margin: 5px;
    cursor: pointer;
}

section {
    padding: 25px;
}
</style>
</head>

<body>

<header>
    <h1>Creativos One</h1>
    <p>Sistema empresarial</p>
</header>

<nav>
    <button onclick="mostrar('inicio')">Inicio</button>
    <button onclick="mostrar('clientes')">Clientes</button>
    <button onclick="mostrar('ventas')">Ventas</button>
</nav>

<section id="contenido">
    <h2>Inicio</h2>
    <p>Creativos One está funcionando.</p>
</section>

<script>
function mostrar(pagina) {

    const contenido = document.getElementById("contenido");

    if (pagina === "inicio") {
        contenido.innerHTML = `
            <h2>Inicio</h2>
            <p>Dashboard de Creativos One.</p>
        `;
    }

    if (pagina === "clientes") {
        contenido.innerHTML = `
            <h2>Clientes</h2>
            <p>Aquí construiremos el módulo de clientes.</p>
        `;
    }

    if (pagina === "ventas") {
        contenido.innerHTML = `
            <h2>Ventas</h2>
            <p>Aquí construiremos cotizaciones y ventas.</p>
        `;
    }
}
</script>

</body>
</html>
