<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creativos One</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
}

nav {
    background: white;
    padding: 15px;
    border-bottom: 1px solid #ddd;
}

button {
    padding: 12px 18px;
    margin-right: 8px;
    border: 0;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

main {
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 15px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    box-sizing: border-box;
}

.close {
    background: #6b7280;
}
</style>
</head>

<body>

<header>
    <h1>Creativos One</h1>
    <p>Sistema empresarial</p>
</header>

<nav>

    <button onclick="mostrarInicio()">
        Inicio
    </button>

    <button onclick="mostrarClientes()">
        Clientes
    </button>

    <button onclick="abrirCliente()">
        + Nuevo cliente
    </button>

</nav>

<main>

    <div id="contenido" class="card">

        <h2>Dashboard</h2>

        <p>
            Creativos One está funcionando correctamente.
        </p>

    </div>

</main>


<!-- VENTANA NUEVO CLIENTE -->

<div id="modalCliente" class="modal">

    <div class="modal-box">

        <h2>Nuevo cliente</h2>

        <label>
            Nombre
        </label>

        <input
            id="nombreCliente"
            type="text"
            placeholder="Nombre del cliente"
        >

        <label>
            Empresa
        </label>

        <input
            id="empresaCliente"
            type="text"
            placeholder="Empresa"
        >

        <button onclick="guardarCliente()">
            Guardar cliente
        </button>

        <button
            class="close"
            onclick="cerrarCliente()">

            Cancelar

        </button>

    </div>

</div>


<script>

let clientes = [];


/* INICIO */

function mostrarInicio() {

    document.getElementById("contenido").innerHTML = `

        <h2>Dashboard</h2>

        <p>
            Bienvenido a Creativos One.
        </p>

        <p>
            Clientes registrados:
            <strong>${clientes.length}</strong>
        </p>

    `;

}


/* CLIENTES */

function mostrarClientes() {

    let lista = "";

    if (clientes.length === 0) {

        lista = "<p>No hay clientes registrados.</p>";

    } else {

        clientes.forEach(function(cliente) {

            lista += `

                <div style="
                    padding:10px;
                    border-bottom:1px solid #ddd;
                ">

                    <strong>
                        ${cliente.nombre}
                    </strong>

                    <br>

                    ${cliente.empresa}

                </div>

            `;

        });

    }


    document.getElementById("contenido").innerHTML = `

        <h2>Clientes</h2>

        <button onclick="abrirCliente()">
            + Nuevo cliente
        </button>

        <div style="margin-top:20px">

            ${lista}

        </div>

    `;

}


/* ABRIR */

function abrirCliente() {

    document
        .getElementById("modalCliente")
        .classList.add("active");

}


/* CERRAR */

function cerrarCliente() {

    document
        .getElementById("modalCliente")
        .classList.remove("active");

}


/* GUARDAR */

function guardarCliente() {

    const nombre =
        document
        .getElementById("nombreCliente")
        .value
        .trim();


    const empresa =
        document
        .getElementById("empresaCliente")
        .value
        .trim();


    if (nombre === "") {

        alert("Escribe el nombre del cliente.");

        return;

    }


    clientes.push({

        nombre: nombre,

        empresa: empresa

    });


    document
        .getElementById("nombreCliente")
        .value = "";


    document
        .getElementById("empresaCliente")
        .value = "";


    cerrarCliente();

    mostrarClientes();

}

</script>

</body>
</html>
